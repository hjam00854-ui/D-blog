 `<script>` tag added at the bottom for you to copy and paste:

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

</head>
<body>

  </header>

  <main>
    <article>
      <h2>First Blog Post</h2>
      <p>This is my very first blog post. More coming soon!</p>
    </article>
  </main>

  <footer>
    <p>© 2025 My Blog</p>
  </footer>

  <script src="blog.js"></script>
</body>
</html>
